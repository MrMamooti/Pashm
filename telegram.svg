<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="230"
     viewBox="0 0 1200 230">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13b89d"/>
      <stop offset="48%" stop-color="#075b72"/>
      <stop offset="100%" stop-color="#7135d4"/>
    </linearGradient>

    <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b7e91" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#743ac7" stop-opacity=".65"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4"
                    flood-color="#000000" flood-opacity=".25"/>
    </filter>

    <style>
      .fa {
        font-family: Tahoma, Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="230" rx="25" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <g fill="#ffffff" opacity=".25">
    <circle cx="35" cy="20" r="2"/>
    <circle cx="110" cy="42" r="2"/>
    <circle cx="210" cy="25" r="2"/>
    <circle cx="310" cy="48" r="2"/>
    <circle cx="420" cy="25" r="2"/>
    <circle cx="520" cy="45" r="2"/>
    <circle cx="620" cy="22" r="2"/>
    <circle cx="740" cy="45" r="2"/>
    <circle cx="850" cy="24" r="2"/>
    <circle cx="970" cy="45" r="2"/>
    <circle cx="1080" cy="25" r="2"/>
    <circle cx="1160" cy="50" r="2"/>
  </g>

  <!-- Bottom glass panel -->
  <rect x="0" y="180" width="1200" height="50"
        fill="url(#bottom)" opacity=".7"/>

  <!-- Telegram circle -->
  <circle cx="1045" cy="115" r="58"
          fill="#25a9df"
          filter="url(#shadow)"/>

  <!-- Telegram icon -->
  <path d="M1008 115
           L1074 86
           Q1082 82 1078 94
           L1062 143
           Q1060 149 1055 145
           L1038 132
           L1029 141
           Q1026 144 1026 138
           L1027 128
           L1061 98
           L1020 122
           L1009 118
           Q1003 116 1008 115Z"
        fill="white"/>

  <!-- Top text -->
  <text x="955" y="84"
        text-anchor="end"
        class="fa"
        font-size="18"
        fill="#a7f4e5">
    آموزش‌ها، کانفیگ‌های تازه، خبر قطعی‌ها
  </text>

  <!-- Main title -->
  <text x="955" y="138"
        text-anchor="end"
        class="fa"
        font-size="42"
        fill="white"
        filter="url(#shadow)">
    کانال رسمی Mamooti
  </text>

  <!-- Telegram username -->
  <text x="955" y="175"
        text-anchor="end"
        font-family="Arial, sans-serif"
        font-size="23"
        font-weight="700"
        fill="#e8ddff">
    @ParsPing_ir
  </text>

  <!-- Join button -->
  <rect x="80" y="82"
        width="280"
        height="66"
        rx="34"
        fill="#ffc83d"
        filter="url(#shadow)"/>

  <text x="220" y="124"
        text-anchor="middle"
        dominant-baseline="middle"
        class="fa"
        font-size="25"
        fill="#171717">
    عضویت در کانال
  </text>

  <!-- Bottom decorative stars -->
  <g fill="white">
    <circle cx="32" cy="210" r="2"/>
    <circle cx="137" cy="209" r="2.5"/>
    <circle cx="273" cy="211" r="2"/>
    <circle cx="548" cy="209" r="2"/>
    <circle cx="685" cy="210" r="3"/>
    <circle cx="838" cy="210" r="2"/>
    <circle cx="1096" cy="210" r="3"/>
  </g>

  <!-- Border -->
  <rect x="1.5" y="1.5"
        width="1197"
        height="227"
        rx="24"
        fill="none"
        stroke="white"
        stroke-opacity=".18"
        stroke-width="3"/>

</svg>

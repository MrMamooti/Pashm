<script>
/*
  Mamooti Panel
  تبدیل برند JinX / Super JinX به Mamooti
*/

(function () {
  "use strict";

  /* ---------- Brand ---------- */
  var MAMOOTI_NAME = "Mamooti";
  var MAMOOTI_FA = "مموتی";
  var TELEGRAM = "https://t.me/ParsPing_ir";

  /* ---------- Subscription data ---------- */
  var D = {};
  try {
    D = JSON.parse(
      document.getElementById("jx-data").textContent
    ) || {};
  } catch (e) {
    D = {};
  }

  var $ = function (id) {
    return document.getElementById(id);
  };

  var NL = String.fromCharCode(10);

  /* ---------- Languages ---------- */
  var T = {

    fa: {
      tag: "اشتراک اختصاصی شما",
      exp: "تاریخ انقضا",
      left: "زمان باقی‌مانده",
      useT: "مصرف حجم",
      used: "مصرف شده",
      sUsed: "مصرف شده",
      sLeft: "باقی‌مانده",
      sAll: "کل حجم",

      pingT: "پینگ تا سرور",
      retest: "تست دوباره",

      subT: "لینک اشتراک",
      copy: "کپی",
      save: "ذخیره عکس",
      close: "بستن",
      qr: "QR کد",
      all: "کپی همه",

      appsT: "اتصال با یک لمس",
      rec: "پیشنهادی",

      cfgT: "کانفیگ‌ها",
      cfgN: " کانفیگ",

      helpT: "آموزش اتصال",

      tgT: "کانال تلگرام مموتی",
      tgS: "آپدیت‌ها، آموزش و پشتیبانی",

      copied: "کپی شد",
      copiedAll: "همه کانفیگ‌ها کپی شد",

      copyFail: "کپی نشد، دستی کپی کن",
      saved: "عکس QR ذخیره شد",

      unl: "نامحدود",
      unlS: "حجم نامحدود",

      day: " روز",
      hr: " ساعت",
      none: "ندارد",

      active: "فعال",
      on_hold: "منتظر اولین اتصال",
      soon: "رو به اتمام",
      expired: "منقضی",
      limited: "حجم تمام",
      disabled: "غیرفعال",

      quick: "اتصال سریع با ",

      q: [
        "عالی",
        "خیلی خوب",
        "خوب",
        "معمولی",
        "ضعیف"
      ],

      testing: "در حال تست...",
      noResp: "بدون پاسخ، دوباره بزن",

      wBad: "اشتراک شما {s} شده. برای تمدید به کانال پیام بده.",
      wDays: "فقط {n} روز تا پایان اشتراک مونده.",
      wHours: "کمتر از یک روز تا پایان اشتراک مونده.",
      wData: "{n}% از حجم مصرف شده.",

      empty:
        "کانفیگی برای نمایش نیست. لینک اشتراک رو به اپ اضافه کن و یه بار آپدیتش کن.",

      h: [
        [
          "V2Box (آیفون و اندروید)",
          "اپ V2Box رو نصب کن، بعد دکمه‌ی پایین صفحه یا آیکون V2Box رو بزن. اشتراک خودش اضافه میشه، یه کانفیگ انتخاب کن و وصل شو."
        ],
        [
          "v2rayNG و Hiddify (اندروید)",
          "دکمه‌ی اپ رو بزن. اگر باز نشد، لینک اشتراک رو کپی کن و از قسمت import from clipboard داخل اپ واردش کن، بعد اشتراک رو آپدیت کن."
        ],
        [
          "پینگ قرمزه ولی وصل میشه؟",
          "کاملا عادیه. توی تنظیمات اپ آدرس تست رو بذار روی http://cp.cloudflare.com/generate_204 و از تست Real Delay استفاده کن تا عدد واقعی رو ببینی."
        ],
        [
          "کانفیگ وصل نمیشه؟",
          "اول اشتراک رو توی اپ آپدیت کن. اگه درست نشد، یه کانفیگ دیگه از لیست رو امتحان کن یا توی کانال تلگرام بهمون خبر بده."
        ]
      ]
    },

    en: {
      tag: "Your private subscription",
      exp: "Expires",
      left: "Time left",
      useT: "Data usage",
      used: "used",
      sUsed: "Used",
      sLeft: "Remaining",
      sAll: "Total",

      pingT: "Ping to server",
      retest: "Retest",

      subT: "Subscription link",
      copy: "Copy",
      save: "Save image",
      close: "Close",
      qr: "QR code",
      all: "Copy all",

      appsT: "One-tap connect",
      rec: "Best",

      cfgT: "Configs",
      cfgN: " configs",

      helpT: "How to connect",

      tgT: "Mamooti Telegram channel",
      tgS: "Updates, guides and support",

      copied: "Copied",
      copiedAll: "All configs copied",

      copyFail: "Could not copy, copy it by hand",
      saved: "QR image saved",

      unl: "Unlimited",
      unlS: "Unlimited data",

      day: " days",
      hr: " hours",
      none: "None",

      active: "Active",
      on_hold: "Waiting for first use",
      soon: "Ending soon",
      expired: "Expired",
      limited: "Data used up",
      disabled: "Disabled",

      quick: "Quick connect with ",

      q: [
        "Excellent",
        "Very good",
        "Good",
        "Fair",
        "Weak"
      ],

      testing: "Testing...",
      noResp: "No answer, tap retest",

      wBad:
        "Your subscription is {s}. Message the channel to renew.",

      wDays:
        "Only {n} days left on your subscription.",

      wHours:
        "Less than a day left on your subscription.",

      wData:
        "{n}% of your data is used.",

      empty:
        "No configs to show yet. Add the subscription link to your app and update it once.",

      h: [
        [
          "V2Box (iPhone and Android)",
          "Install V2Box, then tap the button at the bottom or the V2Box icon. The subscription is added for you, pick a config and connect."
        ],
        [
          "v2rayNG and Hiddify (Android)",
          "Tap the app button. If it does not open, copy the subscription link and use import from clipboard in the app, then update the subscription."
        ],
        [
          "Red ping but it connects?",
          "That is normal. Set the app test URL to http://cp.cloudflare.com/generate_204 and use Real Delay to see the true number."
        ],
        [
          "A config does not connect?",
          "Update the subscription in the app first. If it still fails, try another config from the list or tell us in the Telegram channel."
        ]
      ]
    }
  };

  /* ---------- Language ---------- */

  var lang = "fa";

  try {
    lang = localStorage.getItem("jx-lang") || "";
  } catch (e) {}

  if (lang !== "fa" && lang !== "en") {
    var nl = String(navigator.language || "fa").toLowerCase();
    lang = /^en/.test(nl) ? "en" : "fa";
  }

  function L() {
    return T[lang];
  }

  /* ---------- Helpers ---------- */

  function num(n, d) {
    n = Number(n);

    if (!isFinite(n)) {
      n = 0;
    }

    return n.toLocaleString("en-US", {
      maximumFractionDigits:
        d == null ? 1 : d
    });
  }

  function sz(b) {
    b = +b || 0;

    var u = [
      ["TB", 1099511627776],
      ["GB", 1073741824],
      ["MB", 1048576]
    ];

    for (var i = 0; i < u.length; i++) {
      if (b >= u[i][1]) {
        var v = b / u[i][1];

        return (
          num(v, v >= 100 ? 0 : 1) +
          " " +
          u[i][0]
        );
      }
    }

    return num(b / 1024, 0) + " KB";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(
      /[&<>"']/g,
      function (c) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[c];
      }
    );
  }

  /* ---------- Subscription ---------- */

  var used = Math.max(0, +D.used || 0);
  var limit = Math.max(0, +D.limit || 0);
  var expire = +D.expire || 0;

  if (expire > 1e12) {
    expire = Math.floor(expire / 1000);
  }

  var unl = !limit;

  var status = String(
    D.status || "active"
  )
    .toLowerCase()
    .replace(/^userstatus\./, "");

  var pct = unl
    ? 0
    : Math.min(
        100,
        (used / limit) * 100
      );

  var sub =
    location.origin +
    location.pathname
      .replace(/\/+$/, "")
      .replace(
        /\/(info|usage|links|links_base64|xray|clash|clash_meta|sing_box|sing-box|outline|wireguard)$/,
        ""
      );

  var links = (
    Array.isArray(D.links)
      ? D.links
      : []
  )
    .map(function (l) {
      return String(l || "").trim();
    })
    .filter(function (l) {
      return /^[a-z0-9+.-]+:\/\//i.test(l);
    });

  var ua =
    navigator.userAgent || "";

  var REC =
    /Android/i.test(ua)
      ? "v2rayNG"
      : "V2Box";

  /* ---------- Config parser ---------- */

  function parse(l) {

    var proto =
      (
        /^([a-z0-9+.-]+):\/\//i.exec(l) ||
        []
      )[1] || "";

    proto = proto.toLowerCase();

    var name = "";
    var q = {};

    var h = l.indexOf("#");

    if (h > -1) {
      var raw = l.slice(h + 1);

      try {
        name = decodeURIComponent(
          raw.replace(/\+/g, " ")
        );
      } catch (e) {
        name = raw;
      }
    }

    var qs =
      (
        l
          .split("#")[0]
          .split("?")[1] || ""
      );

    qs.split("&").forEach(function (p) {

      var i = p.indexOf("=");

      if (i > 0) {

        try {
          q[p.slice(0, i)] =
            decodeURIComponent(
              p.slice(i + 1)
            );
        } catch (e) {
          q[p.slice(0, i)] =
            p.slice(i + 1);
        }
      }
    });

    if (proto === "vmess") {

      try {

        var b = l.slice(8);

        var j = JSON.parse(
          atob(
            b.replace(/-/g, "+")
             .replace(/_/g, "/")
          )
        );

        name =
          j.ps ||
          j.name ||
          name;

      } catch (e) {}
    }

    var P = {
      vmess: "VMess",
      vless: "VLESS",
      trojan: "Trojan",
      ss: "Shadowsocks",
      hysteria2: "Hysteria2",
      hy2: "Hysteria2",
      tuic: "TUIC",
      wireguard: "WireGuard"
    }[proto] || proto.toUpperCase();

    var N = {
      ws: "WS",
      httpupgrade: "HTTPUpgrade",
      grpc: "gRPC",
      xhttp: "XHTTP",
      splithttp: "XHTTP",
      tcp: "TCP",
      h2: "H2",
      quic: "QUIC"
    }[
      String(
        q.type || ""
      ).toLowerCase()
    ] ||
    (
      q.type
        ? String(q.type).toUpperCase()
        : ""
    );

    var tags = [
      N ? P + " · " + N : P
    ];

    if (
      q.security &&
      q.security !== "none" &&
      q.security !== "tls"
    ) {
      tags.push(
        String(q.security).toUpperCase()
      );
    }

    if (q.fp) {

      var f = String(q.fp);

      tags.push(
        f === "ios"
          ? "iOS"
          : f.charAt(0).toUpperCase() +
            f.slice(1)
      );
    }

    /*
      اسم کانفیگ از خود لینک اشتراک گرفته می‌شود.
      اینجا فقط اگر اسم خالی باشد، نوع پروتکل نمایش داده می‌شود.
    */

    name = String(name || "")
      .replace(/\s+/g, " ")
      .trim() || P;

    /*
      اگر اسم کانفیگ قبلاً Super JinX / JinX داشته باشد،
      فقط همان بخش برند عوض می‌شود.
    */

    name = name
      .replace(/Super\s*JinX/gi, MAMOOTI_NAME)
      .replace(/JinX/gi, MAMOOTI_NAME)
      .replace(/jinx/gi, MAMOOTI_NAME)
      .replace(/سوپر\s*جینکس/g, MAMOOTI_FA)
      .replace(/جینکس/g, MAMOOTI_FA);

    var low =
      name.toLowerCase();

    var plain =
      name.normalize
        ? name.normalize("NFKC").toLowerCase()
        : low;

    var ic = "p-node";
    var ac = "#60a5fa";
    var pro = false;

    if (/pro/.test(plain)) {
      ic = "p-crown";
      ac = "#ffc457";
      pro = true;

    } else if (/flash/.test(plain)) {
      ic = "p-bolt";
      ac = "#38bdf8";

    } else if (/fire/.test(plain)) {
      ic = "p-flame";
      ac = "#fb7185";

    } else if (/diamond/.test(plain)) {
      ic = "p-gem";
      ac = "#a78bfa";

    } else if (/night/.test(plain)) {
      ic = "p-moon";
      ac = "#818cf8";
    }

    return {
      name: name,
      tags: tags,
      ic: ic,
      ac: ac,
      pro: pro
    };
  }

  var CFG = links.map(parse);

  /* ---------- App import ---------- */

  function appUrl(n) {

    var u =
      encodeURIComponent(sub);

    /*
      مهم:
      نام اشتراک در اپ‌ها از Super JinX
      به Mamooti تغییر کرده است.
    */

    var nm =
      encodeURIComponent(MAMOOTI_NAME);

    return {
      V2Box:
        "v2box://install-sub?url=" +
        u +
        "&name=" +
        nm,

      v2rayNG:
        "v2rayng://install-sub?url=" +
        u +
        "&name=" +
        nm,

      Hiddify:
        "hiddify://import/" +
        sub +
        "#" +
        nm,

      Streisand:
        "streisand://import/" +
        sub +
        "#" +
        nm,

      Happ:
        "happ://add/" +
        sub,

      NekoBox:
        "sn://subscription?url=" +
        u +
        "&name=" +
        nm

    }[n];
  }

  /* ---------- Apps ---------- */

  var APPS = [
    ["V2Box", "#3b82f6", "#1e3a8a", "V"],
    ["v2rayNG", "#22c55e", "#14532d", "N"],
    ["Hiddify", "#a855f7", "#4c1d95", "H"],
    ["Streisand", "#06b6d4", "#164e63", "S"],
    ["Happ", "#f59e0b", "#78350f", "Hp"],
    ["NekoBox", "#ec4899", "#831843", "K"]
  ];

  /* ---------- Status ---------- */

  function state() {

    var now =
      Date.now() / 1000;

    if (
      status === "disabled"
    ) {
      return ["bad", "disabled"];
    }

    if (
      status === "expired" ||
      (expire && expire < now)
    ) {
      return ["bad", "expired"];
    }

    if (
      status === "limited" ||
      (limit && used >= limit)
    ) {
      return ["bad", "limited"];
    }

    if (
      status === "on_hold"
    ) {
      return ["hold", "on_hold"];
    }

    if (
      (expire &&
        expire - now < 3 * 86400) ||
      (limit && pct >= 90)
    ) {
      return ["warn", "soon"];
    }

    return ["", "active"];
  }

  /* ---------- UI ---------- */

  var reduce =
    !!(
      window.matchMedia &&
      matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches
    );

  /*
    Telegram link را مستقیماً روی کانال جدید قرار می‌دهیم.
  */

  var tg =
    document.querySelector(
      'a.tgc.rv'
    );

  if (tg) {
    tg.href = TELEGRAM;
  }

  /*
    هر متن باقی‌مانده‌ی برند قدیمی در صفحه
    نیز به Mamooti تبدیل می‌شود.
  */

  function replaceBrand(root) {

    if (!root) return;

    var walker =
      document.createTreeWalker(
        root,
        NodeFilter.SHOW_TEXT,
        null,
        false
      );

    var nodes = [];

    while (
      walker.nextNode()
    ) {
      nodes.push(
        walker.currentNode
      );
    }

    nodes.forEach(function (node) {

      node.nodeValue =
        node.nodeValue
          .replace(
            /Super\s*JinX/gi,
            MAMOOTI_NAME
          )
          .replace(
            /JinX/gi,
            MAMOOTI_NAME
          )
          .replace(
            /سوپر\s*جینکس/g,
            MAMOOTI_FA
          )
          .replace(
            /جینکس/g,
            MAMOOTI_FA
          );
    });
  }

  /*
    عنوان صفحه
  */

  if (document.title) {

    document.title =
      document.title
        .replace(
          /Super\s*JinX/gi,
          MAMOOTI_NAME
        )
        .replace(
          /JinX/gi,
          MAMOOTI_NAME
        )
        .replace(
          /سوپر\s*جینکس/g,
          MAMOOTI_FA
        )
        .replace(
          /جینکس/g,
          MAMOOTI_FA
        );
  }

  /*
    بعد از آماده شدن DOM،
    برند قدیمی را از متن‌های قابل مشاهده حذف می‌کنیم.
  */

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      function () {
        replaceBrand(
          document.body
        );
      }
    );

  } else {

    replaceBrand(
      document.body
    );
  }

})();
</script>
